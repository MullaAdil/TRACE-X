<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cyber Badge Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6"/>
  
  <!-- Radar Coordinates & Rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="3 2"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="32" cy="32" r="4.5" fill="url(#cyanBlue)"/>
  <circle cx="32" cy="32" r="1.8" fill="#ffffff"/>

  <!-- Crosshair Targeting Pointers -->
  <line x1="32" y1="4" x2="32" y2="13" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="32" y1="51" x2="32" y2="60" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="4" y1="32" x2="13" y2="32" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="51" y1="32" x2="60" y2="32" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Stylized TRACE-X Radar Crossbeams -->
  <path d="M21 21 L43 43 M43 21 L21 43" stroke="url(#cyanBlue)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M21 21 L43 43 M43 21 L21 43" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Active Telemetry Blip (Green) -->
  <circle cx="45" cy="19" r="2.8" fill="#10b981" filter="url(#glow)"/>
  <circle cx="45" cy="19" r="5" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
</svg>