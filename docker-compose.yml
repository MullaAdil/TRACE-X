services:
  trace-x:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trace-x-platform
    restart: always
    ports:
      - "80:8000"
    environment:
      - PORT=8000
      - PYTHONPATH=/app
    volumes:
      - trace-x-db:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  trace-x-db:
